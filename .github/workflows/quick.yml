name: quick

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - master
      - 'branch-*'

permissions:
  contents: read

env:
  # Disable keepAlive and pool
  # https://github.com/actions/virtual-environments/issues/1499#issuecomment-689467080
  MAVEN_OPTS: >-
      -Xms1024M -Xmx2048M -XX:MaxMetaspaceSize=1024m -XX:-UseGCOverheadLimit
      -Dhttp.keepAlive=false
      -Dmaven.wagon.http.pool=false
      -Dmaven.wagon.http.retryHandler.count=3
  MAVEN_ARGS: >-
      -B --no-transfer-progress

jobs:
  license-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
      - name: Check Rat
        run: ./mvnw apache-rat:check -Prat ${MAVEN_ARGS}
  maven-validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
      - name: Run Maven Validate
        run: ./mvnw validate -Pinclude-hadoop ${MAVEN_ARGS}
  python-lock-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check Python dependency locks match testing/envs
        run: |
          # Keep the version in sync with .github/actions/setup-conda-lock.
          python3 -m venv "${RUNNER_TEMP}/conda-lock-tools"
          "${RUNNER_TEMP}/conda-lock-tools/bin/python" -m pip install --quiet conda-lock==4.0.3
          "${RUNNER_TEMP}/conda-lock-tools/bin/python" testing/update_python_locks.py --check
