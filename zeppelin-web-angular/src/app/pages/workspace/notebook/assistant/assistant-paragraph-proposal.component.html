@if (proposal) {
  <section class="assistant-proposal" aria-label="Suggested change from the assistant">
    <header class="assistant-proposal-bar">
      <span class="assistant-proposal-mark" aria-hidden="true">AI</span>
      <strong>Suggested change</strong>
      <span class="assistant-proposal-summary">{{ summary }}</span>
      <span class="assistant-proposal-actions">
        <button nz-button nzType="primary" nzSize="small" (click)="decide('allow')">Allow</button>
        <button nz-button nzSize="small" (click)="decide('skip')">Skip</button>
      </span>
    </header>
    @if (changedSinceProposed) {
      <p class="assistant-proposal-note" role="note">
        This paragraph changed after the suggestion. Allow replaces it with the suggested text.
      </p>
    }
    <zeppelin-code-editor
      nzEditorMode="diff"
      [nzOriginalText]="text"
      [nzEditorOption]="editorOption"
      [ngModel]="proposal.text"
      [style.height.px]="height"
    ></zeppelin-code-editor>
  </section>
}
