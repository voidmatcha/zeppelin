<svg class="dot" viewBox="0 0 12 12" aria-hidden="true" focusable="false" [attr.data-state]="state">
  @switch (state) {
    @case ('healthy') {
      <circle class="body" cx="6" cy="6" r="6" />
    }
    @case ('unhealthy') {
      <circle class="body" cx="6" cy="6" r="6" />
      <rect class="mark" x="5" y="3" width="2" height="6" rx="1" />
    }
    @case ('starting') {
      <circle class="ring" cx="6" cy="6" r="5.25" stroke-width="1.5" />
      <path class="half" d="M6 0.75A5.25 5.25 0 0 0 6 11.25Z" />
    }
    @case ('not-running') {
      <circle class="ring" cx="6" cy="6" r="5" stroke-width="2" />
    }
    @case ('checking') {
      <path class="arc" d="M9.536 2.464A5 5 0 1 1 2.464 2.464" stroke-width="2" />
    }
    @case ('failed') {
      <circle class="body" cx="6" cy="6" r="6" />
      <rect class="mark" x="5" y="2" width="2" height="5" rx="1" />
      <rect class="mark" x="5" y="8" width="2" height="2" rx="1" />
    }
    @case ('unknown') {
      <circle class="dashed" cx="6" cy="6" r="5.25" stroke-width="1.5" stroke-dasharray="3.2 2.3" />
    }
  }
</svg>
