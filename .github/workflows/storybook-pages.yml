name: Assistant Storybook Pages
on:
  push:
    branches: [voidmatcha/assistant-storybook-share]
permissions:
  contents: read
concurrency:
  group: assistant-storybook-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'voidmatcha/zeppelin'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:storybook
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:storybook
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: storybook-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: storybook-static
          path: ${{ runner.temp }}/storybook-static
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: ${{ runner.temp }}/storybook-static
          clean: false
          force: false
